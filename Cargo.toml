[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/subanov/cooper"
publish = false

[workspace.dependencies]
# Internal crates
cooper-kernel = { path = "crates/kernel" }
cooper-platform = { path = "crates/platform" }
cooper-http = { path = "crates/http" }
cooper-identity = { path = "crates/identity" }
cooper-administration = { path = "crates/administration" }
cooper-service-desk = { path = "crates/service-desk" }
cooper-notifications = { path = "crates/notifications" }
cooper-problem-management = { path = "crates/problem-management" }

# Runtime and web
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "catch-panic",
    "compression-full",
    "cors",
    "limit",
    "request-id",
    "timeout",
    "trace",
    "util",
] }
http = "1.5"
http-body-util = "0.1"

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "uuid",
] }

# Data and errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.29", features = ["serde", "v5", "v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
base64 = "0.23"
async-trait = "0.1"

# Security
argon2 = "0.6"
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
sha1 = "0.11"
aes-gcm = "0.11"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = "1.0"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# ID token signatures (ADR-0025); already used by rustls.
ring = "0.17"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

# OpenAPI
utoipa = { version = "6", features = ["chrono", "uuid"] }
utoipa-axum = "0.3"
# Embeds the built web/ SPA into cooper-server (ADR-0010).
rust-embed = { version = "8.13", default-features = false }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Testing
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
