[package]
name = "cooper-service-desk"
description = "Cooper service desk context: Tickets, Ticket reference data, Categories, Notes, Time Entries, views and search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
## Microsoft 365 Mailboxes through Microsoft Graph.
graph = ["dep:reqwest"]
## Google Workspace Mailboxes through the Gmail API.
google = ["dep:reqwest"]
## Suggested Replies through the Google Gemini API (FR-AI-003).
ai = ["dep:reqwest"]

[dependencies]
async-imap.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cooper-http.workspace = true
cooper-kernel.workspace = true
cooper-platform.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
http.workspace = true
mail-parser.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
cooper-platform = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio.workspace = true

[lints]
workspace = true
