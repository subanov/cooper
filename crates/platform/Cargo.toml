[package]
name = "cooper-platform"
description = "Cooper shared infrastructure: configuration, PostgreSQL pool and migrations, tenant-scoped transactions, audit log, transactional outbox, background job runner and telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Helpers for tests in other crates (tenant isolation harness).
testing = []
## Export traces over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set (ADR-0023).
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tokio-rustls"]

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
cooper-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
cooper-platform = { workspace = true, features = ["testing"] }
proptest.workspace = true

[lints]
workspace = true
