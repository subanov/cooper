# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check` (or `just deny`). CI runs it on every pull request.

[graph]
all-features = true

[advisories]
# RustSec advisories (this replaces a separate cargo-audit run). Every ignore needs a
# comment with the reason and an issue link.
yanked = "deny"
ignore = [
    # pin-utils is unmaintained but stable and tiny; only async-imap uses it. #244
    { id = "RUSTSEC-2026-0441", reason = "unmaintained, no vulnerability; via async-imap (#244)" },
]

[licenses]
# Permissive licences compatible with any licence Cooper may choose. Add to this list
# only after review; copyleft licences need an ADR.
allow = [
    # Zero-clause BSD: permissive, no attribution needed (quoted_printable, via lettre).
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# MPL-2.0 (file-level copyleft) only for the CSS parser that `ammonia` uses to sanitise
# Knowledge HTML (ADR-0028). Cooper uses these crates unmodified. Older ammonia versions
# without them have RUSTSEC-2021-0157.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cssparser"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "dtoa-short"

[licenses.private]
# Cooper's own crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL: Cooper uses rustls only.
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
