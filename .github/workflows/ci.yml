name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  SQLX_CLI_VERSION: "0.9.0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      # Compile-time checked queries use the committed .sqlx/ data; no database needed.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rustdoc
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cooper
          POSTGRES_PASSWORD: cooper
          POSTGRES_DB: cooper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cooper -d cooper"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # IMAP/SMTP test server for the email intake test (#91).
      greenmail:
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled
        ports:
          - 3025:3025
          - 3143:3143
    env:
      DATABASE_URL: postgres://cooper:cooper@localhost:5432/cooper
      COOPER_TEST_GREENMAIL_HOST: localhost
      COOPER_REQUIRE_GREENMAIL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install sqlx-cli
        run: |
          if ! sqlx --version 2>/dev/null | grep -q "$SQLX_CLI_VERSION"; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features rustls,postgres
          fi
      - name: Apply migrations
        run: cargo sqlx migrate run
      - name: Wait for GreenMail
        run: for i in $(seq 1 60); do (echo > /dev/tcp/localhost/3143) 2>/dev/null && exit 0; sleep 1; done; exit 1
      - name: Check .sqlx offline data is up to date
        run: cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Tests
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast
      - name: Doc tests
        run: cargo test --workspace --all-features --locked --doc

  migrations:
    name: Migrations are forward-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check migrations
        run: |
          base="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          if [ "${{ github.event_name }}" = "push" ]; then base="${{ github.event.before }}"; fi
          scripts/check-migrations.sh "$base"

  dependencies:
    name: Dependencies (cargo-deny, cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Advisories, licences, bans and sources
        run: cargo deny --all-features check
      - name: Unused dependencies
        run: cargo machete

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Build migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

  # --- Web UI (web/, ADR-0010) ---------------------------------------------------------------

  web:
    name: Web (typecheck, lint, unit, visual)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile, install scripts denied)
        run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies
        run: pnpm run audit
      - name: Typecheck, Biome, generated API client, Vitest
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Build Storybook
        run: pnpm build-storybook --quiet
      - name: Visual regression (Storybook screenshots + axe-core)
        run: pnpm visual
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-report
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7

  web-e2e:
    name: Web end-to-end (Playwright + axe-core)
    needs: web
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Start PostgreSQL (with the app role)
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres
      - name: Install sqlx-cli
        run: |
          if ! sqlx --version 2>/dev/null | grep -q "$SQLX_CLI_VERSION"; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features rustls,postgres
          fi
      - name: Apply migrations
        run: set -a && . ./.env && set +a && cargo sqlx migrate run
      - name: Build cooper-server
        run: cargo build -p cooper-server --locked
      - name: Start cooper-server (serves web/dist from disk)
        run: |
          set -a && . ./.env && set +a
          COOPER_BIND_ADDR=127.0.0.1:8080 nohup target/debug/cooper-server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/health/ready && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Playwright end-to-end tests
        run: pnpm --dir web e2e
        env:
          COOPER_E2E_URL: http://127.0.0.1:8080
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report
          path: |
            server.log
            web/test-results
            web/playwright-report
          retention-days: 7
