name: DevOps
description: CI/CD, infrastructure, tooling or operations.
labels: ["type: devops", "area: devops"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] Documented (README, AGENTS.md §8 or a runbook in docs/)
        - [ ] Reproducible from a clean checkout / runs in CI
        - [ ] No secrets committed; new variables in .env.example
