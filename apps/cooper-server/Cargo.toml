[package]
name = "cooper-server"
description = "Cooper HTTP server: wires bounded contexts, routing and middleware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["graph", "google", "otlp"]
## Microsoft 365 Mailboxes (Microsoft Graph).
graph = ["cooper-service-desk/graph"]
## Google Workspace Mailboxes (Gmail API).
google = ["cooper-service-desk/google"]
## Export traces over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set (ADR-0023).
otlp = ["cooper-platform/otlp"]

[dependencies]
anyhow.workspace = true
