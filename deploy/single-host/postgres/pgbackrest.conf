# pgBackRest configuration (docs/runbooks/backup-and-restore.md).
#
# repo1 is a local volume (/var/lib/pgbackrest). For off-site copies add an S3-compatible
# repo2 (repo2-type=s3, repo2-s3-bucket, repo2-s3-endpoint, repo2-s3-region and the key
# in PGBACKREST_REPO2_S3_KEY / PGBACKREST_REPO2_S3_KEY_SECRET environment variables).
[global]
repo1-path=/var/lib/pgbackrest
# Keep two full backups and the WAL needed to restore to any point since the older one.
repo1-retention-full=2
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[cooper]
pg1-path=/var/lib/postgresql/18/docker
# The superuser is POSTGRES_USER (`cooper`), reached over the local socket.
pg1-user=cooper
pg1-database=cooper
