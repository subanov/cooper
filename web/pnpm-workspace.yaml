# web/ and the API code generator (tools/openapi-codegen: openapi-typescript needs the
# TypeScript compiler API, which TypeScript 7 does not provide yet, so it keeps its own
# TypeScript 6 there).
packages:
  - "."
  - "tools/openapi-codegen"

# Supply-chain policy (ADR-0010).
# Only install versions that have been public for at least 7 days.
minimumReleaseAge: 10080
# Dependency install scripts are denied unless listed here. esbuild's script only
# verifies its platform binary, which pnpm already installs.
allowBuilds:
  esbuild: false

# Security overrides for transitive dev dependencies (Dependabot alerts #1 and #2).
# Storybook 10.6's docgen plugin still pins glob 13, so no upstream bump fixes these;
# drop each override once the dependency that pulls it in requires a fixed version.
# - glob <= 14.0.1: AbortSignal cancellation bypass (fixed in 14.0.2).
# - minimatch 7.x to 11.0.0: denial of service via globparts amplification (fixed in 11.0.1).
overrides:
  "glob@>=9.0.0 <14.0.2": ^14.0.4
  "minimatch@>=7.0.0 <11.0.1": ^11.0.5
