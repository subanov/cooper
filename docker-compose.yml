# Local development stack for Cooper.
#
#   docker compose up -d                 # everything
#   docker compose up -d postgres        # just the database
#
# Services:
#   postgres  PostgreSQL 16. Owner role `cooper` (runs migrations), app role `cooper_app`.
#   mailpit   SMTP capture for outbound mail. Web UI: http://localhost:8025
#   greenmail IMAP/SMTP test server for mailbox intake. Users are created on first login.
name: cooper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cooper
      POSTGRES_PASSWORD: cooper
      POSTGRES_DB: cooper
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooper -d cooper"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  greenmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "${GREENMAIL_IMAP_PORT:-3143}:3143"
      - "${GREENMAIL_IMAPS_PORT:-3993}:3993"

volumes:
  pgdata:
